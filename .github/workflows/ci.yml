name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.lock
      - run: python scripts/validate_data.py
      - run: node --check static/js/main.js
      - run: python -m unittest discover -s tests
        env:
          SAMSTAG_DB: ${{ runner.temp }}/samstag-tests.sqlite3
          COLLECTION_ON_VISIT: "0"
          DEMO_ENABLED: "0"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - run: pnpm test -- --project=chromium
        working-directory: e2e
        env:
          SAMSTAG_PYTHON: python
          SAMSTAG_E2E_OUTPUT: ${{ runner.temp }}/samstag-e2e
